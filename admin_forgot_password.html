<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Forgot Password | LifeSaver</title>
    <link rel="stylesheet" href="../static/css/style.css?v=2.0">
    <link rel="stylesheet" href="/static/css/style.css?v=2.0">
    <style>
        body {
            background: linear-gradient(135deg, #f6f8ff 0%, #ecfdf5 100%);
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .auth-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            width: min(100%, 520px);
            background: rgba(255,255,255,0.96);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            padding: 2rem;
        }
        .auth-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .brand-mark {
            width: 52px;
            height: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1, #14b8a6);
            color: white;
            border-radius: 16px;
            font-size: 1.7rem;
            font-weight: 800;
        }
        .auth-links {
            text-align: center;
            margin-top: 1rem;
        }
        .inline-link {
            color: var(--teal);
            text-decoration: none;
            font-weight: 600;
        }
        .inline-link:hover { text-decoration: underline; }
        .toast {
            position: fixed;
            right: 1.25rem;
            bottom: 1.25rem;
            min-width: 240px;
            max-width: 380px;
            background: rgba(15, 23, 42, 0.94);
            color: white;
            padding: 0.9rem 1.1rem;
            border-radius: 10px;
            box-shadow: var(--shadow-md);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.25s ease;
            pointer-events: none;
            z-index: 9999;
            font-size: 0.9rem;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .otp-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.35rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .otp-timer {
            font-weight: 600;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-top">
                <button type="button" class="btn-back" onclick="window.location.href='/admin/signin'">← Back</button>
                <div class="brand-mark">♥</div>
            </div>

            <div class="form-header" style="display:block; border-bottom:none; padding:0; margin-bottom:1.5rem; text-align:center;">
                <div style="font-size:2.5rem; margin-bottom:0.5rem;">🔑</div>
                <h2 class="form-title" style="margin:0;">Reset Admin Password</h2>
                <p class="form-subtitle" style="margin-top:0.5rem;">Verify via Email OTP sent to your registered email address</p>
            </div>

            <form id="adminForgotPasswordForm">
                <div class="form-group" style="margin-bottom:1rem;">
                    <label class="form-label" for="admin_forgot_email">Registered Admin Email or Username <span class="req-star">*</span></label>
                    <div class="otp-input-group">
                        <input type="text" id="admin_forgot_email" name="email" class="form-control" placeholder="Enter registered email or username" autocomplete="off" spellcheck="false" required>
                        <button type="button" id="btnSendAdminForgotOtp" class="btn-otp">Send OTP</button>
                    </div>
                    <div class="otp-meta">
                        <span id="adminForgotOtpHelper">Enter your email and click "Send OTP" to receive code in your email.</span>
                        <span id="adminForgotTimer" class="otp-timer" style="display:none;">⏱ 5:00</span>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom:1rem;">
                    <label class="form-label" for="admin_forgot_otp">Email OTP Verification <span class="req-star">*</span></label>
                    <input type="text" id="admin_forgot_otp" name="otp_code" class="form-control" placeholder="Enter 6-digit OTP" maxlength="6" autocomplete="one-time-code" required>
                </div>

                <div class="form-group" style="margin-bottom:1rem;">
                    <label class="form-label" for="admin_forgot_new_password">New Password (min 8 chars, A-Z, a-z, 0-9) <span class="req-star">*</span></label>
                    <input type="password" id="admin_forgot_new_password" name="new_password" class="form-control" placeholder="Enter new password" autocomplete="new-password" required>
                </div>

                <div class="form-group" style="margin-bottom:1.5rem;">
                    <label class="form-label" for="admin_forgot_confirm_password">Confirm Password <span class="req-star">*</span></label>
                    <input type="password" id="admin_forgot_confirm_password" name="confirm_password" class="form-control" placeholder="Confirm new password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; margin-bottom:1rem;">Reset Password</button>

                <div class="auth-links">
                    <a href="/admin/signin" class="inline-link">Back to Sign In</a>
                </div>
            </form>
            <div style="text-align:center; margin-top:1.5rem; font-size:0.75rem; color:#94a3b8;">
                © 2026 Organ & Blood Donation Management System. All rights reserved.
            </div>
        </div>
    </div>

    <div id="authToast" class="toast" aria-live="polite"></div>

    <script>
        const form = document.getElementById('adminForgotPasswordForm');
        const emailInput = document.getElementById('admin_forgot_email');
        const otpInput = document.getElementById('admin_forgot_otp');
        const newPasswordInput = document.getElementById('admin_forgot_new_password');
        const confirmPasswordInput = document.getElementById('admin_forgot_confirm_password');
        const sendOtpBtn = document.getElementById('btnSendAdminForgotOtp');
        const timerSpan = document.getElementById('adminForgotTimer');
        const helperSpan = document.getElementById('adminForgotOtpHelper');
        const toast = document.getElementById('authToast');

        let countdownInterval = null;
        let cooldownInterval = null;

        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.classList.add('show');
            toast.style.background = type === 'error' ? 'rgba(185, 28, 28, 0.94)' : type === 'success' ? 'rgba(22, 101, 52, 0.94)' : 'rgba(15, 23, 42, 0.94)';
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function startOtpTimer(durationSeconds = 300) {
            clearInterval(countdownInterval);
            let remaining = durationSeconds;
            timerSpan.style.display = 'inline';
            
            function updateDisplay() {
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                timerSpan.textContent = `⏱ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
            updateDisplay();

            countdownInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    timerSpan.textContent = '⏱ Expired';
                    showToast('OTP has expired. Please request a new OTP.', 'error');
                } else {
                    updateDisplay();
                }
            }, 1000);
        }

        function startCooldown(cooldownSeconds = 60) {
            clearInterval(cooldownInterval);
            sendOtpBtn.disabled = true;
            let remaining = cooldownSeconds;
            sendOtpBtn.textContent = `Resend (${remaining}s)`;

            cooldownInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(cooldownInterval);
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.textContent = 'Resend OTP';
                } else {
                    sendOtpBtn.textContent = `Resend (${remaining}s)`;
                }
            }, 1000);
        }

        sendOtpBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email) {
                showToast('Please enter your registered email or username first.', 'error');
                emailInput.focus();
                return;
            }

            sendOtpBtn.disabled = true;
            sendOtpBtn.textContent = 'Sending...';

            try {
                const res = await fetch('/api/admin/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
                    body: new URLSearchParams({ email })
                });
                const data = await res.json();
                if (data.success) {
                    const maskedText = data.masked_email ? ` to ${data.masked_email}` : '';
                    showToast(data.message || `OTP has been sent to your registered email address${maskedText}.`, 'success');
                    helperSpan.textContent = data.masked_email ? `OTP sent to ${data.masked_email}` : 'OTP sent to registered email address.';
                    otpInput.focus();
                    startOtpTimer(300);
                    startCooldown(60);
                } else {
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.textContent = 'Send OTP';
                    showToast(data.message || 'Unable to send OTP. Please check email.', 'error');
                }
            } catch (error) {
                sendOtpBtn.disabled = false;
                sendOtpBtn.textContent = 'Send OTP';
                showToast('Unable to send OTP. Please try again.', 'error');
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = emailInput.value.trim();
            const otp = otpInput.value.trim();
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!email || !otp || !newPassword || !confirmPassword) {
                showToast('Please complete all reset-password fields.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('New passwords do not match.', 'error');
                return;
            }

            if (otp.length !== 6) {
                showToast('Please enter the 6-digit OTP code.', 'error');
                otpInput.focus();
                return;
            }

            const payload = new FormData(form);
            try {
                const res = await fetch('/api/admin/reset-password', {
                    method: 'POST',
                    body: payload
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Password reset successful! Redirecting to sign in...', 'success');
                    clearInterval(countdownInterval);
                    clearInterval(cooldownInterval);
                    setTimeout(() => {
                        window.location.href = '/admin/signin';
                    }, 1200);
                } else {
                    showToast(data.message || 'Password reset failed.', 'error');
                }
            } catch (error) {
                showToast('Unable to reset your password right now.', 'error');
            }
        });
    </script>
</body>
</html>
