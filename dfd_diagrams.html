<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFD Diagrams - College Project Report Format</title>
    <link href="https://fonts.googleapis.com/css2?family=Times+New+Roman&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f1f5f9;
            --paper-bg: #ffffff;
            --line-color: #000000;
            --text-color: #000000;
            --accent: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            font-family: 'Times New Roman', Times, serif;
            color: #000;
            padding: 20px;
        }

        /* Top control bar (hidden in print) */
        .toolbar {
            max-width: 1000px;
            margin: 0 auto 25px auto;
            background: #ffffff;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            font-family: 'Inter', sans-serif;
        }

        .toolbar-title h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
        }

        .toolbar-title p {
            font-size: 13px;
            color: #64748b;
        }

        .toolbar-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .preset-select {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #0f172a;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #334155;
        }

        .btn-success {
            background: #16a34a;
            color: #ffffff;
        }
        .btn-success:hover {
            background: #15803d;
        }

        .btn-outline {
            background: #ffffff;
            color: #334155;
            border-color: #cbd5e1;
        }
        .btn-outline:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        /* A4 Page Container matching College Project Report */
        .report-page {
            max-width: 900px;
            margin: 0 auto 35px auto;
            background: var(--paper-bg);
            padding: 50px 60px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            min-height: 1050px;
            position: relative;
        }

        .page-header-title {
            text-align: left;
            font-size: 20px;
            font-weight: bold;
            font-style: normal;
            margin-bottom: 25px;
            font-family: 'Times New Roman', Times, serif;
        }

        .diagram-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
        }

        svg {
            width: 100%;
            height: auto;
            max-width: 850px;
            overflow: visible;
        }

        /* Standard Academic DFD SVG Styles */
        .dfd-entity {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 1.8px;
        }

        .dfd-process {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 1.8px;
        }

        .dfd-store-line {
            stroke: #000000;
            stroke-width: 1.8px;
            fill: none;
        }

        .dfd-store-box {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 1.8px;
        }

        .dfd-arrow {
            stroke: #000000;
            stroke-width: 1.6px;
            fill: none;
        }

        .dfd-text-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 13.5px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000000;
            letter-spacing: 0.5px;
        }

        .dfd-text-id {
            font-family: 'Times New Roman', Times, serif;
            font-size: 13px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000000;
        }

        .dfd-text-label {
            font-family: 'Times New Roman', Times, serif;
            font-size: 11.5px;
            font-style: italic;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000000;
        }

        .figure-caption {
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            font-weight: bold;
            font-style: italic;
            margin-top: 35px;
            letter-spacing: 0.3px;
        }

        .page-footer-num {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-family: 'Times New Roman', Times, serif;
        }

        .card-actions-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
            font-family: 'Inter', sans-serif;
        }

        /* Printable Mode */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .toolbar, .card-actions-bar {
                display: none !important;
            }
            .report-page {
                box-shadow: none;
                border: none;
                padding: 40px 30px;
                margin: 0;
                width: 100%;
                max-width: 100%;
                min-height: auto;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

    <!-- Top Action Toolbar -->
    <div class="toolbar">
        <div class="toolbar-title">
            <h2>Data Flow Diagrams (DFD) - Project Report Style</h2>
            <p>Simple, academic black & white DFD notation for Organ & Blood Donation Management System</p>
        </div>
        <div class="toolbar-actions">
            <label style="font-size: 13px; font-weight: 600; color: #475569;">Preset:</label>
            <select class="preset-select" id="presetSelect" onchange="applyPreset(this.value)">
                <option value="organ_donation">🫀 Organ Donation Project Names</option>
                <option value="report_image">📄 Exact Image Template (Ordering / Customer)</option>
            </select>
            <button class="btn btn-primary" onclick="window.print()">🖨️ Print All Pages / PDF</button>
        </div>
    </div>

    <!-- PAGE 1: LEVEL 0 DATA FLOW DIAGRAM -->
    <div class="report-page" id="page-level-0">
        <div class="card-actions-bar">
            <button class="btn btn-outline" onclick="downloadSVG('svg-level-0', 'Figure_7.1_Level_0_DFD')">⬇️ Download SVG</button>
            <button class="btn btn-outline" onclick="downloadPNG('svg-level-0', 'Figure_7.1_Level_0_DFD')">🖼️ Download PNG (Word)</button>
        </div>

        <div class="page-header-title">Level 0</div>

        <div class="diagram-container">
            <svg id="svg-level-0" viewBox="0 0 850 480" xmlns="http://www.w3.org/2000/svg">
                <!-- Marker definition for clean sharp arrowheads -->
                <defs>
                    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
                    </marker>
                </defs>

                <!-- EXTERNAL ENTITIES (LEFT) -->
                <!-- USER Entity -->
                <rect class="dfd-entity" x="40" y="100" width="130" height="55" rx="0" />
                <text class="dfd-text-title" x="105" y="128">USER</text>

                <!-- ADMIN Entity -->
                <rect class="dfd-entity" x="40" y="320" width="130" height="55" rx="0" />
                <text class="dfd-text-title" x="105" y="348">ADMIN</text>

                <!-- EXTERNAL ENTITIES (RIGHT) -->
                <!-- HOSPITAL / REQUESTER Entity -->
                <rect class="dfd-entity" x="680" y="100" width="130" height="55" rx="0" />
                <text class="dfd-text-title" x="745" y="128">HOSPITAL</text>

                <!-- SMS / EMAIL GATEWAY Entity -->
                <rect class="dfd-entity" x="680" y="320" width="130" height="55" rx="0" />
                <text class="dfd-text-title" x="745" y="348">SMS / EMAIL</text>

                <!-- CENTRAL PROCESS 0.0 (Split Circle) -->
                <!-- Circle background -->
                <circle class="dfd-process" cx="425" cy="240" r="95" />
                <!-- Division line across circle -->
                <line x1="330" y1="210" x2="520" y2="210" stroke="#000000" stroke-width="1.8" />
                <!-- Process ID -->
                <text class="dfd-text-id" x="425" y="185">0.0</text>
                <!-- Process Title -->
                <text class="dfd-text-title" x="425" y="235">ORGAN & BLOOD</text>
                <text class="dfd-text-title" x="425" y="255">DONATION</text>
                <text class="dfd-text-title" x="425" y="275">MANAGEMENT SYSTEM</text>

                <!-- FLOW ARROWS & LABELS -->
                <!-- USER -> Process -->
                <path class="dfd-arrow" d="M 170 120 L 333 195" marker-end="url(#arrow)" />
                <text class="dfd-text-label" x="220" y="145">Donor / Receiver Data</text>

                <!-- Process -> USER -->
                <path class="dfd-arrow" d="M 335 225 L 170 145" marker-end="url(#arrow)" />
                <text class="dfd-text-label" x="220" y="195">Digital Card / OTP</text>

                <!-- ADMIN -> Process -->
                <path class="dfd-arrow" d="M 170 340 L 338 275" marker-end="url(#arrow)" />
                <text class="dfd-text-label" x="225" y="320">Admin Login / Actions</text>

                <!-- Process -> ADMIN -->
                <path class="dfd-arrow" d="M 345 295 L 170 360" marker-end="url(#arrow)" />
                <text class="dfd-text-label" x="235" y="360">System Reports</text>

                <!-- HOSPITAL -> Process -->
                <path class="dfd-arrow" d="M 680 120 L 518 195" marker-end="url(#arrow)" />
                <text class="dfd-text-label" x="625" y="145">Blood / Organ Request</text>

                <!-- Process -> HOSPITAL -->
                <path class="dfd-arrow" d="M 515 225 L 680 145" marker-end="url(#arrow)" />
                <text class="dfd-text-label" x="625" y="195">Compatible Donors</text>

                <!-- Process -> SMS/EMAIL -->
                <path class="dfd-arrow" d="M 510 275 L 680 340" marker-end="url(#arrow)" />
                <text class="dfd-text-label" x="620" y="320">OTP / Alert Triggers</text>
            </svg>
        </div>

        <div class="figure-caption">Figure 7.1 Level 0 data flow diagram</div>
        <div class="page-footer-num">18</div>
    </div>

    <!-- PAGE 2: LEVEL 1 DATA FLOW DIAGRAM (EXACT MATCH TO USER'S IMAGE) -->
    <div class="report-page" id="page-level-1">
        <div class="card-actions-bar">
            <button class="btn btn-outline" onclick="downloadSVG('svg-level-1', 'Figure_7.2_Level_1_DFD')">⬇️ Download SVG</button>
            <button class="btn btn-outline" onclick="downloadPNG('svg-level-1', 'Figure_7.2_Level_1_DFD')">🖼️ Download PNG (Word)</button>
        </div>

        <div class="page-header-title">Level 1</div>

        <div class="diagram-container">
            <svg id="svg-level-1" viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
                    </marker>
                </defs>

                <!-- 1. ENTITY: USER (Rectangle) -->
                <rect class="dfd-entity" x="50" y="140" width="130" height="50" />
                <text class="dfd-text-title" x="115" y="166">USER</text>

                <!-- 2. ENTITY: ADMIN (Rectangle) -->
                <rect class="dfd-entity" x="50" y="340" width="130" height="50" />
                <text class="dfd-text-title" x="115" y="366">ADMIN</text>

                <!-- 3. PROCESS 1.0: REGISTRATION PROCESS (Split Circle) -->
                <ellipse class="dfd-process" cx="370" cy="240" rx="75" ry="60" />
                <!-- Division line -->
                <line x1="295" y1="218" x2="445" y2="218" stroke="#000000" stroke-width="1.8" />
                <!-- ID & Name -->
                <text class="dfd-text-id" x="370" y="198">1.0</text>
                <text class="dfd-text-title" x="370" y="238">REGISTRATION</text>
                <text class="dfd-text-title" x="370" y="258">PROCESS</text>

                <!-- 4. DATA STORE: USER/ADMIN DATA (Open box with double vertical sides) -->
                <!-- Bottom open-box store -->
                <rect class="dfd-store-box" x="290" y="420" width="160" height="50" />
                <!-- Left and Right vertical separator lines (Gane & Sarson standard) -->
                <line x1="310" y1="420" x2="310" y2="470" stroke="#000000" stroke-width="1.8" />
                <line x1="430" y1="420" x2="430" y2="470" stroke="#000000" stroke-width="1.8" />
                <text class="dfd-text-title" x="370" y="446" font-size="12px">USER/ADMIN DATA</text>

                <!-- 5. PROCESS 2.0: LOGIN PROCESS (Split Circle) -->
                <ellipse class="dfd-process" cx="590" cy="240" rx="65" ry="55" />
                <!-- Division line -->
                <line x1="525" y1="220" x2="655" y2="220" stroke="#000000" stroke-width="1.8" />
                <!-- ID & Name -->
                <text class="dfd-text-id" x="590" y="202">2.0</text>
                <text class="dfd-text-title" x="590" y="240">LOGIN</text>
                <text class="dfd-text-title" x="590" y="260">PROCESS</text>

                <!-- 6. PROCESS 3.0: ORGAN DONATION MANAGEMENT (Split Circle Top Right) -->
                <ellipse class="dfd-process" cx="760" cy="120" rx="75" ry="55" />
                <!-- Division line -->
                <line x1="685" y1="102" x2="835" y2="102" stroke="#000000" stroke-width="1.8" />
                <!-- ID & Name -->
                <text class="dfd-text-id" id="p3-id" x="760" y="85">3.0</text>
                <text class="dfd-text-title" id="p3-t1" x="760" y="122">ORGAN DONATION</text>
                <text class="dfd-text-title" id="p3-t2" x="760" y="142">MANAGEMENT</text>

                <!-- 7. PROCESS 4.0: RECEIVER & MATCHING MANAGEMENT (Split Circle Bottom Right) -->
                <ellipse class="dfd-process" cx="760" cy="380" rx="75" ry="55" />
                <!-- Division line -->
                <line x1="685" y1="362" x2="835" y2="362" stroke="#000000" stroke-width="1.8" />
                <!-- ID & Name -->
                <text class="dfd-text-id" id="p4-id" x="760" y="345">4.0</text>
                <text class="dfd-text-title" id="p4-t1" x="760" y="380">RECEIVER & MATCH</text>
                <text class="dfd-text-title" id="p4-t2" x="760" y="400">MANAGEMENT</text>

                <!-- CONNECTIONS & ARROWS -->
                <!-- USER -> Process 1.0 -->
                <path class="dfd-arrow" d="M 180 165 L 295 220" marker-end="url(#arrow1)" />

                <!-- ADMIN -> Process 1.0 -->
                <path class="dfd-arrow" d="M 180 365 L 295 260" marker-end="url(#arrow1)" />

                <!-- Process 1.0 -> Data Store (USER/ADMIN DATA) -->
                <path class="dfd-arrow" d="M 370 300 L 370 418" marker-end="url(#arrow1)" />

                <!-- Process 1.0 -> Process 2.0 (LOGIN PROCESS) -->
                <path class="dfd-arrow" d="M 445 240 L 523 240" marker-end="url(#arrow1)" />

                <!-- Process 2.0 -> Process 3.0 (ORGAN DONATION) -->
                <path class="dfd-arrow" d="M 645 200 L 705 155" marker-end="url(#arrow1)" />

                <!-- Process 2.0 -> Process 4.0 (RECEIVER & MATCH) -->
                <path class="dfd-arrow" d="M 645 278 L 705 340" marker-end="url(#arrow1)" />
            </svg>
        </div>

        <div class="figure-caption">Figure 7.2 Level 1 data flow diagram</div>
        <div class="page-footer-num">19</div>
    </div>

    <!-- PAGE 3: LEVEL 2 DATA FLOW DIAGRAM (DETAILED DRILL DOWN) -->
    <div class="report-page" id="page-level-2">
        <div class="card-actions-bar">
            <button class="btn btn-outline" onclick="downloadSVG('svg-level-2', 'Figure_7.3_Level_2_DFD')">⬇️ Download SVG</button>
            <button class="btn btn-outline" onclick="downloadPNG('svg-level-2', 'Figure_7.3_Level_2_DFD')">🖼️ Download PNG (Word)</button>
        </div>

        <div class="page-header-title">Level 2</div>

        <div class="diagram-container">
            <svg id="svg-level-2" viewBox="0 0 880 540" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
                    </marker>
                </defs>

                <!-- ENTITIES -->
                <rect class="dfd-entity" x="30" y="80" width="120" height="45" />
                <text class="dfd-text-title" x="90" y="104">DONOR</text>

                <rect class="dfd-entity" x="30" y="380" width="120" height="45" />
                <text class="dfd-text-title" x="90" y="404">RECEIVER</text>

                <!-- PROCESSES: SUB-PROCESSES OF DONOR FLOW -->
                <!-- 3.1 Validate & OTP -->
                <ellipse class="dfd-process" cx="260" cy="100" rx="65" ry="45" />
                <line x1="195" y1="88" x2="325" y2="88" stroke="#000000" stroke-width="1.8" />
                <text class="dfd-text-id" x="260" y="72">3.1</text>
                <text class="dfd-text-title" x="260" y="105" font-size="11px">VALIDATE &</text>
                <text class="dfd-text-title" x="260" y="122" font-size="11px">OTP VERIFY</text>

                <!-- 3.2 Save Pledge Profile -->
                <ellipse class="dfd-process" cx="480" cy="100" rx="65" ry="45" />
                <line x1="415" y1="88" x2="545" y2="88" stroke="#000000" stroke-width="1.8" />
                <text class="dfd-text-id" x="480" y="72">3.2</text>
                <text class="dfd-text-title" x="480" y="105" font-size="11px">STORE DONOR</text>
                <text class="dfd-text-title" x="480" y="122" font-size="11px">PROFILE</text>

                <!-- 3.3 Digital Card & QR Generator -->
                <ellipse class="dfd-process" cx="720" cy="100" rx="70" ry="45" />
                <line x1="650" y1="88" x2="790" y2="88" stroke="#000000" stroke-width="1.8" />
                <text class="dfd-text-id" x="720" y="72">3.3</text>
                <text class="dfd-text-title" x="720" y="105" font-size="11px">GENERATE CARD</text>
                <text class="dfd-text-title" x="720" y="122" font-size="11px">& QR CODE</text>

                <!-- CENTRAL DATA STORES -->
                <rect class="dfd-store-box" x="380" y="220" width="160" height="45" />
                <line x1="400" y1="220" x2="400" y2="265" stroke="#000000" stroke-width="1.8" />
                <line x1="520" y1="220" x2="520" y2="265" stroke="#000000" stroke-width="1.8" />
                <text class="dfd-text-title" x="460" y="244" font-size="12px">DONOR STORE</text>

                <rect class="dfd-store-box" x="380" y="300" width="160" height="45" />
                <line x1="400" y1="300" x2="400" y2="345" stroke="#000000" stroke-width="1.8" />
                <line x1="520" y1="300" x2="520" y2="345" stroke="#000000" stroke-width="1.8" />

                <ellipse class="dfd-process" cx="260" cy="400" rx="65" ry="45" />
                <line x1="195" y1="388" x2="325" y2="388" stroke="#000000" stroke-width="1.8" />

                <!-- 4.2 AI Compatibility Matching -->
                <ellipse class="dfd-process" cx="720" cy="400" rx="70" ry="45" />

                <!-- 3.1 -> 3.2 -->

                <!-- 3.2 -> 3.3 -->
                <path class="dfd-arrow" d="M 545 100 L 648 100" marker-end="url(#arrow2)" />

                <!-- 3.2 -> Donor Store -->
                <path class="dfd-arrow" d="M 480 145 L 460 218" marker-end="url(#arrow2)" />

                <!-- Receiver -> 4.1 -->
                <path class="dfd-arrow" d="M 150 400 L 193 400" marker-end="url(#arrow2)" />

                <!-- 4.1 -> Receiver Store -->
                <path class="dfd-arrow" d="M 325 385 L 400 347" marker-end="url(#arrow2)" />

                <!-- Donor Store -> 4.2 -->
                <path class="dfd-arrow" d="M 540 242 L 670 365" marker-end="url(#arrow2)" />

                <!-- Receiver Store -> 4.2 -->
                <path class="dfd-arrow" d="M 540 322 L 660 380" marker-end="url(#arrow2)" />

                <!-- 3.3 -> Donor (Return Card) -->
                <path class="dfd-arrow" d="M 720 55 C 720 15, 90 15, 90 78" marker-end="url(#arrow2)" />
                <text class="dfd-text-label" x="420" y="25">Download Donor Card PDF & QR</text>
            </svg>
        </div>

        <div class="figure-caption">Figure 7.3 Level 2 data flow diagram</div>
        <div class="page-footer-num">20</div>
    </div>

    <!-- SCRIPT FOR HIGH-RES EXPORT -->
    <script>
        function applyPreset(preset) {
            const p3_t1 = document.getElementById('p3-t1');
            const p3_t2 = document.getElementById('p3-t2');
            const p4_t1 = document.getElementById('p4-t1');
            const p4_t2 = document.getElementById('p4-t2');

            if (preset === 'report_image') {
                // Exact match of sample image labels
                if (p3_t1) p3_t1.textContent = 'ORDERING';
                if (p3_t2) p3_t2.textContent = 'MANAGEMENT';
                if (p4_t1) p4_t1.textContent = 'CUSTOMER';
                if (p4_t2) p4_t2.textContent = 'MANAGEMENT';
            } else {
                // Organ donation system labels
                if (p3_t1) p3_t1.textContent = 'ORGAN DONATION';
                if (p3_t2) p3_t2.textContent = 'MANAGEMENT';
                if (p4_t1) p4_t1.textContent = 'RECEIVER & MATCH';
                if (p4_t2) p4_t2.textContent = 'MANAGEMENT';
            }
        }

        // Export SVG directly
        function downloadSVG(svgId, filename) {
            const svg = document.getElementById(svgId);
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svg);

            // Add xml namespace if not present
            if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }

            const svgBlob = new Blob([source], {type:"image/svg+xml;charset=utf-8"});
            const svgUrl = URL.createObjectURL(svgBlob);
            const downloadLink = document.createElement("a");
            downloadLink.href = svgUrl;
            downloadLink.download = filename + ".svg";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        // Export high resolution PNG (300 DPI ready for Microsoft Word project reports)
        function downloadPNG(svgId, filename) {
            const svg = document.getElementById(svgId);
            const serializer = new XMLSerializer();
            const svgStr = serializer.serializeToString(svg);
            const img = new Image();
            
            const svgBlob = new Blob([svgStr], {type: "image/svg+xml;charset=utf-8"});
            const url = URL.createObjectURL(svgBlob);

            img.onload = function() {
                const canvas = document.createElement("canvas");
                // 3x resolution scaling for crisp report print quality
                const scaleFactor = 3;
                canvas.width = svg.viewBox.baseVal.width * scaleFactor;
                canvas.height = svg.viewBox.baseVal.height * scaleFactor;
                const ctx = canvas.getContext("2d");

                // Fill white background for document insert
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);

                const pngUrl = canvas.toDataURL("image/png");
                const downloadLink = document.createElement("a");
                downloadLink.href = pngUrl;
                downloadLink.download = filename + ".png";
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            };

            img.src = url;
        }
    </script>
